<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">NaH W Loading Logo</title>
  <desc id="desc">A fractured glass style NaH W loading logo with brat green shadows.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#eef4f5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#dfe8ec" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8ace00" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.1" fill="#111827" opacity="0.18"/>
    </pattern>
    <filter id="rough-shadow" x="-20%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="14" dy="14" stdDeviation="0" flood-color="#8ace00" flood-opacity="0.24"/>
      <feDropShadow dx="22" dy="20" stdDeviation="0" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="url(#page-bg)"/>
  <g opacity="0.92">
    <polygon points="82,118 188,62 324,92 438,54 590,88 640,256 474,286 316,252 146,300 64,226" fill="url(#glass)" stroke="#111827" stroke-opacity="0.16"/>
    <polygon points="118,76 334,96 252,120 98,104" fill="url(#glare)" opacity="0.52"/>
    <polygon points="430,58 604,90 536,112 404,86" fill="url(#glare)" opacity="0.42"/>
    <polygon points="70,224 226,254 154,284 52,246" fill="#8ace00" opacity="0.16"/>
    <line x1="130" y1="292" x2="648" y2="94" stroke="#8ace00" stroke-width="2" opacity="0.38"/>
    <line x1="84" y1="145" x2="564" y2="272" stroke="#111827" stroke-width="1" opacity="0.12"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="820" font-size="128" letter-spacing="-8" filter="url(#rough-shadow)">
    <g transform="translate(118 224) rotate(-2)">
      <polygon points="-12,-118 92,-130 178,-102 164,42 18,58 -24,4" fill="url(#glass)" stroke="#111827" stroke-opacity="0.18"/>
      <rect x="-2" y="-98" width="170" height="126" fill="url(#halftone)" opacity="0.42"/>
      <text x="0" y="0" fill="#111827">Na</text>
      <text x="8" y="-6" fill="#8ace00" opacity="0.58">Na</text>
    </g>
    <g transform="translate(356 202) rotate(3)">
      <polygon points="-18,-112 86,-126 122,-72 104,46 -8,58 -34,-22" fill="url(#glass)" stroke="#111827" stroke-opacity="0.18"/>
      <rect x="-4" y="-94" width="118" height="118" fill="url(#halftone)" opacity="0.34"/>
      <text x="0" y="0" fill="#111827">H</text>
      <text x="-6" y="7" fill="#8ace00" opacity="0.58">H</text>
    </g>
    <g transform="translate(470 238) rotate(-4)">
      <polygon points="-22,-126 162,-108 190,-20 144,58 18,44 -40,-8" fill="url(#glass)" stroke="#111827" stroke-opacity="0.18"/>
      <rect x="-8" y="-100" width="188" height="132" fill="url(#halftone)" opacity="0.36"/>
      <text x="0" y="0" fill="#111827">W</text>
      <text x="10" y="5" fill="#8ace00" opacity="0.58">W</text>
    </g>
  </g>
</svg>
