<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Standard stream and file descriptor routing</title>
  <desc id="desc">Shell이 프로그램 실행 전에 파일 디스크립터 0, 1, 2의 연결 대상을 정하고, C++ 프로그램은 같은 cin cout cerr 코드를 유지한 채 입력과 출력 대상을 바꾸는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>
      .box { fill:#f8fafc; stroke:#2563eb; stroke-width:3; rx:16; }
      .shell { fill:#eff6ff; stroke:#1d4ed8; stroke-width:3; rx:18; }
      .sink { fill:#fff7ed; stroke:#ea580c; stroke-width:3; rx:16; }
      .title { font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; text-anchor:middle; }
      .text { font:19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; text-anchor:middle; }
      .arrow { stroke:#2563eb; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="580" fill="#fff"/>
  <rect class="shell" x="30" y="28" width="1140" height="70"/><text class="title" x="600" y="58">Shell: exec 전에 FD 0·1·2의 연결 대상을 설정</text><text class="text" x="600" y="85">프로그램의 cin / cout / cerr 코드는 바뀌지 않는다.</text>

  <rect class="sink" x="35" y="155" width="185" height="110"/><text class="title" x="127" y="193">Input source</text><text class="text" x="127" y="225">keyboard · file</text><text class="text" x="127" y="250">pipe read end</text>
  <rect class="box" x="285" y="165" width="170" height="90"/><text class="title" x="370" y="202">FD 0</text><text class="text" x="370" y="232">stdin</text>
  <rect class="box" x="515" y="145" width="175" height="130"/><text class="title" x="602" y="185">C++ process</text><text class="text" x="602" y="218">std::cin</text><text class="text" x="602" y="245">same code</text>
  <path class="arrow" d="M220 210 H285"/><path class="arrow" d="M455 210 H515"/>

  <rect class="box" x="515" y="335" width="175" height="130"/><text class="title" x="602" y="375">C++ process</text><text class="text" x="602" y="408">cout / cerr</text><text class="text" x="602" y="435">independent</text>
  <rect class="box" x="755" y="310" width="155" height="80"/><text class="title" x="832" y="345">FD 1</text><text class="text" x="832" y="373">stdout</text>
  <rect class="box" x="755" y="420" width="155" height="80"/><text class="title" x="832" y="455">FD 2</text><text class="text" x="832" y="483">stderr</text>
  <rect class="sink" x="975" y="310" width="190" height="80"/><text class="title" x="1070" y="345">Normal sink</text><text class="text" x="1070" y="373">terminal · file · pipe</text>
  <rect class="sink" x="975" y="420" width="190" height="80"/><text class="title" x="1070" y="455">Error sink</text><text class="text" x="1070" y="483">terminal · err.txt</text>
  <path class="arrow" d="M690 375 L755 350"/><path class="arrow" d="M690 425 L755 460"/>
  <path class="arrow" d="M910 350 H975"/><path class="arrow" d="M910 460 H975"/>
  <text class="text" x="602" y="545">2&gt;&amp;1은 FD 2가 그 시점의 FD 1 target을 가리키도록 복제한다.</text>
</svg>
