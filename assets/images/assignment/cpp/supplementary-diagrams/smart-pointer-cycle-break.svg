<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">shared_ptr cycle and weak_ptr break</title>
  <desc id="desc">shared pointer 양방향 소유에서는 외부 소유자가 사라져도 A와 B의 strong count가 1로 남고, B에서 A로 가는 연결을 weak pointer로 바꾸면 A가 먼저 파괴되며 A에서 B로 가는 strong ownership도 풀려 B가 파괴되는 상태 변화</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="grayArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; rx:20; }
      .obj { fill:#eff6ff; stroke:#2563eb; stroke-width:3; rx:16; }
      .ext { fill:#fff7ed; stroke:#ea580c; stroke-width:3; rx:14; }
      .title { font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; text-anchor:middle; }
      .text { font:20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; text-anchor:middle; }
      .strong { stroke:#2563eb; stroke-width:4; fill:none; marker-end:url(#blueArrow); }
      .weak { stroke:#64748b; stroke-width:4; stroke-dasharray:9 7; fill:none; marker-end:url(#grayArrow); }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fff"/>
  <text class="title" x="300" y="42">shared ↔ shared: cycle remains</text>
  <rect class="panel" x="25" y="65" width="550" height="490"/>
  <rect class="ext" x="70" y="115" width="105" height="65"/><text class="text" x="122" y="155">a</text>
  <rect class="ext" x="425" y="115" width="105" height="65"/><text class="text" x="477" y="155">b</text>
  <rect class="obj" x="120" y="260" width="150" height="90"/><text class="title" x="195" y="300">A</text><text class="text" x="195" y="330">strong=2</text>
  <rect class="obj" x="330" y="260" width="150" height="90"/><text class="title" x="405" y="300">B</text><text class="text" x="405" y="330">strong=2</text>
  <path class="strong" d="M122 180 L175 260"/><path class="strong" d="M477 180 L425 260"/>
  <path class="strong" d="M270 285 H330"/><path class="strong" d="M330 330 H270"/>
  <text class="text" x="300" y="400">a,b 소멸 뒤에도 A=1, B=1</text><text class="text" x="300" y="435">서로가 마지막 strong owner → leak</text>

  <text class="title" x="900" y="42">shared → / weak ⇢: destruction completes</text>
  <rect class="panel" x="625" y="65" width="550" height="490"/>
  <rect class="ext" x="670" y="115" width="105" height="65"/><text class="text" x="722" y="155">a</text>
  <rect class="ext" x="1025" y="115" width="105" height="65"/><text class="text" x="1077" y="155">b</text>
  <rect class="obj" x="720" y="260" width="150" height="90"/><text class="title" x="795" y="300">A</text><text class="text" x="795" y="330">strong=1</text>
  <rect class="obj" x="930" y="260" width="150" height="90"/><text class="title" x="1005" y="300">B</text><text class="text" x="1005" y="330">strong=2</text>
  <path class="strong" d="M722 180 L775 260"/><path class="strong" d="M1077 180 L1025 260"/>
  <path class="strong" d="M870 285 H930"/><path class="weak" d="M930 330 H870"/>
  <text class="text" x="900" y="390">b 소멸: B strong 2→1</text>
  <text class="text" x="900" y="425">a 소멸: A strong 1→0, A 파괴</text>
  <text class="text" x="900" y="460">A→B 해제: B strong 1→0, B 파괴</text>
  <text class="text" x="600" y="595">실선은 strong ownership, 점선은 use count를 늘리지 않는 weak observation이다.</text>
</svg>
