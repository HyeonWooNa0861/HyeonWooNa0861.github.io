<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Recursion tree level costs for T(n)=2T(n/2)+n</title>
  <desc id="desc">At depth i there are two to the i subproblems, each of size n divided by two to the i, so every internal level costs n. There are log base two n internal levels and n unit-cost leaves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c8"/>
    </marker>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .label{font:600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .small{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#36536f}
      .node{fill:#eef6ff;stroke:#3578c8;stroke-width:2}
      .leaf{fill:#e6f4ea;stroke:#2f855a;stroke-width:2}
      .guide{stroke:#8cb5e5;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="520" rx="18" fill="#fbfdff"/>
  <text x="480" y="42" text-anchor="middle" class="title">T(n) = 2T(n/2) + n</text>

  <rect x="405" y="72" width="150" height="48" rx="10" class="node"/>
  <text x="480" y="102" text-anchor="middle" class="label">n</text>

  <line x1="445" y1="120" x2="300" y2="168" class="guide"/>
  <line x1="515" y1="120" x2="660" y2="168" class="guide"/>
  <rect x="225" y="174" width="150" height="48" rx="10" class="node"/>
  <rect x="585" y="174" width="150" height="48" rx="10" class="node"/>
  <text x="300" y="204" text-anchor="middle" class="label">n/2</text>
  <text x="660" y="204" text-anchor="middle" class="label">n/2</text>

  <line x1="270" y1="222" x2="165" y2="270" class="guide"/>
  <line x1="330" y1="222" x2="405" y2="270" class="guide"/>
  <line x1="630" y1="222" x2="555" y2="270" class="guide"/>
  <line x1="690" y1="222" x2="795" y2="270" class="guide"/>
  <rect x="95" y="276" width="140" height="46" rx="10" class="node"/>
  <rect x="335" y="276" width="140" height="46" rx="10" class="node"/>
  <rect x="485" y="276" width="140" height="46" rx="10" class="node"/>
  <rect x="725" y="276" width="140" height="46" rx="10" class="node"/>
  <text x="165" y="305" text-anchor="middle" class="label">n/4</text>
  <text x="405" y="305" text-anchor="middle" class="label">n/4</text>
  <text x="555" y="305" text-anchor="middle" class="label">n/4</text>
  <text x="795" y="305" text-anchor="middle" class="label">n/4</text>

  <text x="905" y="102" text-anchor="end" class="small">depth 0: 1 × n = n</text>
  <text x="905" y="204" text-anchor="end" class="small">depth 1: 2 × n/2 = n</text>
  <text x="480" y="348" text-anchor="middle" class="small">depth 2: 4 × n/4 = n</text>
  <text x="480" y="374" text-anchor="middle" class="small">⋮ each internal level costs n ⋮</text>

  <rect x="105" y="390" width="750" height="52" rx="12" class="leaf"/>
  <text x="480" y="423" text-anchor="middle" class="label">depth log₂n: n leaves × T(1)=1 → n</text>
  <text x="480" y="484" text-anchor="middle" class="title">n log₂n + n = Θ(n log n)</text>
</svg>
