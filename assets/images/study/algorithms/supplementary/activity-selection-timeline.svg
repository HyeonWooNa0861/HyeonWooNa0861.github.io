<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Earliest-finish activity selection trace</title>
  <desc id="desc">Meetings are shown on one time axis. The selected meetings B, C, D, and E form a compatible sequence. A and F overlap the current selected boundary and are skipped.</desc>
  <defs>
    <style>
      .title{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .tick{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#526b82}
      .axis{stroke:#526b82;stroke-width:2}
      .grid{stroke:#d8e7f5;stroke-width:1}
      .chosen{fill:#3578c8;stroke:#1f5fa8;stroke-width:2}
      .skip{fill:#edf1f5;stroke:#7b8fa3;stroke-width:2;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="960" height="460" rx="18" fill="#fbfdff"/>
  <text x="480" y="40" text-anchor="middle" class="title">Sort by (finish, start), then scan left to right</text>
  <line x1="170" y1="410" x2="870" y2="410" class="axis"/>
  <g>
    <line x1="170" y1="65" x2="170" y2="415" class="grid"/><text x="170" y="438" text-anchor="middle" class="tick">0</text>
    <line x1="270" y1="65" x2="270" y2="415" class="grid"/><text x="270" y="438" text-anchor="middle" class="tick">1</text>
    <line x1="370" y1="65" x2="370" y2="415" class="grid"/><text x="370" y="438" text-anchor="middle" class="tick">2</text>
    <line x1="470" y1="65" x2="470" y2="415" class="grid"/><text x="470" y="438" text-anchor="middle" class="tick">3</text>
    <line x1="570" y1="65" x2="570" y2="415" class="grid"/><text x="570" y="438" text-anchor="middle" class="tick">4</text>
    <line x1="670" y1="65" x2="670" y2="415" class="grid"/><text x="670" y="438" text-anchor="middle" class="tick">5</text>
    <line x1="770" y1="65" x2="770" y2="415" class="grid"/><text x="770" y="438" text-anchor="middle" class="tick">6</text>
    <line x1="870" y1="65" x2="870" y2="415" class="grid"/><text x="870" y="438" text-anchor="middle" class="tick">7</text>
  </g>
  <text x="80" y="100" class="label">B [1,2)</text><rect x="270" y="77" width="100" height="34" rx="8" class="chosen"/>
  <text x="80" y="152" class="label">A [0,3)</text><rect x="170" y="129" width="300" height="34" rx="8" class="skip"/>
  <text x="80" y="204" class="label">C [2,4)</text><rect x="370" y="181" width="200" height="34" rx="8" class="chosen"/>
  <text x="80" y="256" class="label">D [4,4]</text><circle cx="570" cy="245" r="13" class="chosen"/>
  <text x="80" y="308" class="label">E [4,6)</text><rect x="570" y="285" width="200" height="34" rx="8" class="chosen"/>
  <text x="80" y="360" class="label">F [5,7)</text><rect x="670" y="337" width="200" height="34" rx="8" class="skip"/>
  <rect x="690" y="78" width="22" height="22" rx="5" class="chosen"/><text x="722" y="95" class="tick">selected</text>
  <rect x="690" y="112" width="22" height="22" rx="5" class="skip"/><text x="722" y="129" class="tick">skipped</text>
</svg>
