<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">Gradient descent feedback loop</title>
  <desc id="desc">Parameters produce predictions, predictions and targets define a loss, the loss gradient updates the parameters, and the cycle repeats until a stopping condition is met.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c8"/>
    </marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#36536f}
      .box{fill:#eef6ff;stroke:#3578c8;stroke-width:2}
      .stop{fill:#e6f4ea;stroke:#2f855a;stroke-width:2}
      .arrow{fill:none;stroke:#3578c8;stroke-width:3;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#2f855a;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="420" rx="18" fill="#fbfdff"/>
  <text x="540" y="45" text-anchor="middle" class="title">Gradient descent is a repeated feedback loop</text>

  <rect x="55" y="120" width="190" height="82" rx="12" class="box"/>
  <text x="150" y="151" text-anchor="middle" class="label">Parameters</text>
  <text x="150" y="178" text-anchor="middle" class="small">w, b</text>

  <rect x="310" y="120" width="190" height="82" rx="12" class="box"/>
  <text x="405" y="151" text-anchor="middle" class="label">Prediction</text>
  <text x="405" y="178" text-anchor="middle" class="small">ŷ = f(x; w, b)</text>

  <rect x="565" y="120" width="190" height="82" rx="12" class="box"/>
  <text x="660" y="151" text-anchor="middle" class="label">Loss</text>
  <text x="660" y="178" text-anchor="middle" class="small">compare ŷ with y</text>

  <rect x="820" y="120" width="205" height="82" rx="12" class="box"/>
  <text x="922" y="151" text-anchor="middle" class="label">Gradient update</text>
  <text x="922" y="178" text-anchor="middle" class="small">w ← w − η∇L</text>

  <path d="M245 161 H300" class="arrow"/>
  <path d="M500 161 H555" class="arrow"/>
  <path d="M755 161 H810" class="arrow"/>
  <path d="M922 202 V282 C922 328 785 340 540 340 C295 340 150 328 150 212" class="feedback"/>
  <text x="540" y="374" text-anchor="middle" class="small">repeat with updated parameters; stop when the chosen criterion is met</text>

  <rect x="565" y="232" width="190" height="56" rx="12" class="stop"/>
  <text x="660" y="267" text-anchor="middle" class="small">loss is a scalar; gradient gives a direction</text>
</svg>
