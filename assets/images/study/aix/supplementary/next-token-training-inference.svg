<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Next-token training and inference</title>
  <desc id="desc">Training predicts shifted targets at all positions from a fixed sequence and sums token losses. Inference predicts one distribution, selects a token, appends it to the context, and repeats.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c8"/>
    </marker>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .rowtitle{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .label{font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .small{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#36536f}
      .box{fill:#eef6ff;stroke:#3578c8;stroke-width:2}
      .target{fill:#e6f4ea;stroke:#2f855a;stroke-width:2}
      .arrow{fill:none;stroke:#3578c8;stroke-width:3;marker-end:url(#arrow)}
      .loop{fill:none;stroke:#2f855a;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .divider{stroke:#c8d8e8;stroke-width:2}
    </style>
  </defs>
  <rect width="1120" height="520" rx="18" fill="#fbfdff"/>
  <text x="560" y="44" text-anchor="middle" class="title">The same next-token model is used in two different schedules</text>
  <line x1="45" y1="260" x2="1075" y2="260" class="divider"/>

  <text x="55" y="105" class="rowtitle">Training</text>
  <rect x="185" y="75" width="235" height="72" rx="12" class="box"/>
  <text x="302" y="104" text-anchor="middle" class="label">Fixed token sequence</text>
  <text x="302" y="130" text-anchor="middle" class="small">[BOS], A, cute, teddy, bear</text>
  <rect x="485" y="75" width="250" height="72" rx="12" class="box"/>
  <text x="610" y="104" text-anchor="middle" class="label">Parallel position logits</text>
  <text x="610" y="130" text-anchor="middle" class="small">one distribution per position</text>
  <rect x="800" y="75" width="245" height="72" rx="12" class="target"/>
  <text x="922" y="104" text-anchor="middle" class="label">Shifted targets + loss</text>
  <text x="922" y="130" text-anchor="middle" class="small">Σₜ −log p(yₜ | y&lt;ₜ)</text>
  <path d="M420 111 H475" class="arrow"/>
  <path d="M735 111 H790" class="arrow"/>
  <text x="560" y="196" text-anchor="middle" class="small">teacher forcing exposes all target positions at once; the causal mask still blocks future tokens</text>

  <text x="55" y="326" class="rowtitle">Inference</text>
  <rect x="185" y="296" width="205" height="72" rx="12" class="box"/>
  <text x="287" y="325" text-anchor="middle" class="label">Current context</text>
  <text x="287" y="351" text-anchor="middle" class="small">generated prefix</text>
  <rect x="455" y="296" width="205" height="72" rx="12" class="box"/>
  <text x="557" y="325" text-anchor="middle" class="label">One distribution</text>
  <text x="557" y="351" text-anchor="middle" class="small">next-token probabilities</text>
  <rect x="725" y="296" width="205" height="72" rx="12" class="target"/>
  <text x="827" y="325" text-anchor="middle" class="label">Select + append</text>
  <text x="827" y="351" text-anchor="middle" class="small">greedy, beam, or sampling</text>
  <path d="M390 332 H445" class="arrow"/>
  <path d="M660 332 H715" class="arrow"/>
  <path d="M827 368 V418 C827 454 690 468 557 468 C423 468 287 454 287 378" class="loop"/>
  <text x="557" y="498" text-anchor="middle" class="small">the selected token changes the context for the next step</text>
</svg>
