<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Fleet learning closed loop</title>
  <desc id="desc">Deployed vehicles provide fleet data, failure mining selects difficult cases, auto-labeling creates supervision, training updates the model, validation gates the release, and deployment starts the next cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3578c8"/>
    </marker>
    <style>
      .title{font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .label{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#16324f}
      .small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#36536f}
      .box{fill:#eef6ff;stroke:#3578c8;stroke-width:2}
      .gate{fill:#e6f4ea;stroke:#2f855a;stroke-width:2}
      .arrow{fill:none;stroke:#3578c8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1080" height="600" rx="18" fill="#fbfdff"/>
  <text x="540" y="48" text-anchor="middle" class="title">Fleet learning is a deployment–data feedback loop</text>

  <rect x="380" y="85" width="320" height="76" rx="12" class="box"/>
  <text x="540" y="115" text-anchor="middle" class="label">1. Fleet data</text>
  <text x="540" y="141" text-anchor="middle" class="small">real roads, rare situations, model outcomes</text>

  <rect x="710" y="205" width="320" height="76" rx="12" class="box"/>
  <text x="870" y="235" text-anchor="middle" class="label">2. Failure mining</text>
  <text x="870" y="261" text-anchor="middle" class="small">select difficult or safety-relevant cases</text>

  <rect x="620" y="390" width="330" height="76" rx="12" class="box"/>
  <text x="785" y="420" text-anchor="middle" class="label">3. Auto-labeling</text>
  <text x="785" y="446" text-anchor="middle" class="small">turn selected data into supervision</text>

  <rect x="130" y="390" width="330" height="76" rx="12" class="box"/>
  <text x="295" y="420" text-anchor="middle" class="label">4. Train + validate</text>
  <text x="295" y="446" text-anchor="middle" class="small">update the model; check release criteria</text>

  <rect x="50" y="205" width="300" height="76" rx="12" class="gate"/>
  <text x="200" y="235" text-anchor="middle" class="label">5. Deployment</text>
  <text x="200" y="261" text-anchor="middle" class="small">ship only a validated model</text>

  <path d="M700 131 C770 139 823 164 853 195" class="arrow"/>
  <path d="M870 281 C867 327 838 360 807 382" class="arrow"/>
  <path d="M620 428 H470" class="arrow"/>
  <path d="M270 390 C231 357 205 325 202 291" class="arrow"/>
  <path d="M219 205 C271 145 326 127 370 123" class="arrow"/>

  <text x="540" y="532" text-anchor="middle" class="small">A faster loop improves coverage only when mining, labels, validation, and deployment remain reliable.</text>
</svg>
