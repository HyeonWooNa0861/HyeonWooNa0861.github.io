<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="title desc">
  <title id="title">Three comparison points in a separation pipeline</title>
  <desc id="desc">The same model produces a mask, a masked magnitude, and a waveform. MA compares the mask; SA compares the magnitude; waveform loss compares the decoded audio. The clean targets are used during training.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#34669f"/></marker></defs>
  <rect width="720" height="640" rx="16" fill="#f7faff"/>
  <g font-family="Arial, sans-serif" fill="#19334f">
    <text x="32" y="42" font-size="23" font-weight="700">One pipeline. Three comparison points.</text>
    <text x="32" y="73" font-size="17">Clean targets are required during training.</text>
    <g fill="#e3eefb" stroke="#34669f" stroke-width="2">
      <rect x="40" y="106" width="310" height="68" rx="9"/>
      <rect x="40" y="212" width="310" height="68" rx="9"/>
      <rect x="40" y="318" width="310" height="68" rx="9"/>
      <rect x="40" y="424" width="310" height="68" rx="9"/>
      <rect x="40" y="530" width="310" height="68" rx="9"/>
    </g>
    <g text-anchor="middle" font-size="18">
      <text x="195" y="133">Mixture waveform y</text><text x="195" y="157">STFT: complex Y</text>
      <text x="195" y="252">Mask network</text>
      <text x="195" y="348">Predicted mask M</text><text x="195" y="374">MA compares here</text>
      <text x="195" y="451">Masked magnitude A = M · |Y|</text><text x="195" y="476">SA compares here</text>
      <text x="195" y="558">iSTFT with chosen phase</text><text x="195" y="582">Predicted waveform s</text>
    </g>
    <g stroke="#34669f" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M195 174V209"/><path d="M195 280V315"/><path d="M195 386V421"/><path d="M195 492V527"/>
      <path d="M350 352H408"/><path d="M350 458H408"/><path d="M350 564H408"/>
    </g>
    <g fill="#fff" stroke="#a8bfd9" stroke-width="1.5">
      <rect x="415" y="318" width="268" height="68" rx="9"/>
      <rect x="415" y="424" width="268" height="68" rx="9"/>
      <rect x="415" y="530" width="268" height="68" rx="9"/>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="549" y="346" font-weight="700">MA</text><text x="549" y="371">Compare with target mask</text>
      <text x="549" y="452" font-weight="700">SA</text><text x="549" y="477">Compare with clean |S|</text>
      <text x="549" y="558" font-weight="700">Waveform loss</text><text x="549" y="583">Compare with clean samples</text>
    </g>
    <text x="415" y="222" font-size="17">Choose one or combine losses.</text>
    <text x="415" y="249" font-size="17">These are not mandatory</text>
    <text x="415" y="276" font-size="17">consecutive training stages.</text>
    <text x="32" y="627" font-size="14">Diagram: nonnegative real-mask model; mixture phase can be reused.</text>
  </g>
</svg>
