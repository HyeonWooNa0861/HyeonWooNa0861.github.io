<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="title desc">
  <title id="title">Teacher forcing versus inference: which token is fed back?</title>
  <desc id="desc">Both paths use the same source X. Suppose the correct first token is A but a token selected from the first distribution is B. Training compares the distribution with A and supplies reference A to step two. Inference supplies selected B to step two. Solid blue arrows carry inputs; dashed gray arrows show loss comparison only.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#102a43;text-anchor:middle;font-size:20px}.heading{font-weight:700;font-size:23px}.small{font-size:17px}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.neutral{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.loss{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#gray)}</style>
  </defs>
  <rect width="680" height="600" rx="12" fill="#ffffff"/>
  <text x="170" y="34" class="heading">Teacher forcing</text>
  <text x="510" y="34" class="heading">Inference</text>
  <path d="M340 50V555" stroke="#cbd5e1"/>
  <rect class="box" x="35" y="65" width="270" height="62" rx="8"/>
  <rect class="box" x="375" y="65" width="270" height="62" rx="8"/>
  <text x="170" y="91">Step 1 distribution</text><text x="170" y="115">decoder(X, BOS)</text>
  <text x="510" y="91">Step 1 distribution</text><text x="510" y="115">decoder(X, BOS)</text>
  <path class="flow" d="M170 127V166"/><path class="flow" d="M510 127V166"/>
  <rect class="neutral" x="35" y="170" width="270" height="57" rx="8"/>
  <rect class="box" x="375" y="170" width="270" height="57" rx="8"/>
  <text x="170" y="195">Example selection: B</text><text x="170" y="217" class="small">not used as the next input</text>
  <text x="510" y="204">Selected token: B</text>
  <path class="loss" d="M42 96H18V278H40"/>
  <rect class="neutral" x="45" y="250" width="250" height="57" rx="8"/>
  <text x="170" y="274">Loss: distribution</text><text x="170" y="297">compared with target A</text>
  <rect class="box" x="35" y="365" width="270" height="62" rx="8"/>
  <rect class="box" x="375" y="365" width="270" height="62" rx="8"/>
  <text x="170" y="390">Next prefix: A</text><text x="170" y="414" class="small">supplied by the reference</text>
  <text x="510" y="390">Next prefix: B</text><text x="510" y="414" class="small">supplied by the decoder</text>
  <path class="flow" d="M510 227V361"/>
  <text x="570" y="294" class="small">feedback</text>
  <path class="flow" d="M170 427V466"/><path class="flow" d="M510 427V466"/>
  <rect class="box" x="35" y="470" width="270" height="62" rx="8"/>
  <rect class="box" x="375" y="470" width="270" height="62" rx="8"/>
  <text x="170" y="495">Step 2 distribution</text><text x="170" y="519">decoder(X, prefix=A)</text>
  <text x="510" y="495">Step 2 distribution</text><text x="510" y="519">decoder(X, prefix=B)</text>
  <text x="340" y="573" class="small">Same source X; different prefixes can produce different distributions.</text>
</svg>
