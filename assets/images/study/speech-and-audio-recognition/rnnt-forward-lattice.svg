<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">RNN-T forward lattice: two frames, target a</title>
  <desc id="desc">Token a moves upward without advancing time. Blank moves right. Two complete paths have probabilities 0.24 and 0.28, summing to 0.52. Both end with a blank from state (1,1) to (2,1).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="920" height="410" rx="16" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#172b4d" text-anchor="middle">
    <text x="460" y="36" font-size="23" font-weight="700">RNN-T: T = 2, target = a</text>
    <text x="460" y="65" font-size="17">Only paths producing exactly one a are shown</text>
    <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M 180 140 H 448"/>
      <path d="M 488 140 H 758"/>
      <path d="M 180 300 H 448"/>
      <path d="M 160 280 V 162"/>
      <path d="M 468 280 V 162"/>
    </g>
    <g font-size="19">
      <text x="314" y="121">blank: 0.6</text>
      <text x="623" y="121">blank: 0.8</text>
      <text x="314" y="281">blank: 0.5</text>
      <text x="113" y="225">a: 0.5</text>
      <text x="420" y="225">a: 0.7</text>
    </g>
    <g stroke="#2563eb" stroke-width="2" fill="#eff6ff">
      <circle cx="160" cy="140" r="20"/>
      <circle cx="468" cy="140" r="20"/>
      <circle cx="778" cy="140" r="20"/>
      <circle cx="778" cy="140" r="15"/>
      <circle cx="160" cy="300" r="20"/>
      <circle cx="468" cy="300" r="20"/>
    </g>
    <g font-size="18">
      <text x="160" y="103">(0,1)</text>
      <text x="468" y="103">(1,1)</text>
      <text x="778" y="103">(2,1): end</text>
      <text x="160" y="337">(0,0): start</text>
      <text x="468" y="337">(1,0)</text>
      <text x="160" y="177">sum = 0.5</text>
      <text x="468" y="177">sum = 0.65</text>
      <text x="778" y="177" font-weight="700">P(a | X) = 0.52</text>
    </g>
    <text x="650" y="255" font-size="17">blank → time advances</text>
    <text x="650" y="284" font-size="17">a ↑ output grows</text>
    <text x="460" y="385" font-size="19">a blank blank: 0.24  +  blank a blank: 0.28  =  0.52</text>
  </g>
</svg>
