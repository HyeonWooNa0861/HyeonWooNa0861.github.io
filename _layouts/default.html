<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #d9dee7;
        --accent: #2563eb;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.72;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }

      .wrap {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .site-header .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
      }

      .brand {
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .nav-link {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
      }

      .nav-link:hover {
        color: var(--text);
      }

      main {
        padding: 40px 0 72px;
      }

      h1, h2, h3 {
        line-height: 1.35;
      }

      h1 {
        margin-top: 0;
        font-size: 34px;
      }

      h2 {
        margin-top: 40px;
        padding-top: 8px;
        font-size: 24px;
      }

      a {
        color: var(--accent);
      }

      .post-meta {
        margin: -12px 0 32px;
        color: var(--muted);
        font-size: 14px;
      }

      .post-list {
        display: grid;
        gap: 16px;
        padding: 0;
        list-style: none;
      }

      .post-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .post-card a {
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }

      .post-card p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .about-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 24px;
      }

      .profile-list {
        display: grid;
        gap: 14px;
        margin: 0;
      }

      .profile-list div {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        gap: 16px;
      }

      .profile-list dt {
        color: var(--muted);
        font-weight: 600;
      }

      .profile-list dd {
        margin: 0;
      }

      .image-frame {
        max-width: 100%;
        margin: 0 0 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        aspect-ratio: 4 / 3;
      }

      .image-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .image-caption {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }

      .post-resource-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 360px);
        gap: 24px;
        align-items: start;
        margin-top: 16px;
      }

      .post-resource-grid h2 {
        margin-top: 0;
        padding-top: 0;
      }

      @media (max-width: 720px) {
        .post-resource-grid {
          grid-template-columns: 1fr;
        }

        .profile-list div {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">GitBlog</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="nav-link" href="{{ '/assignment/' | relative_url }}">Assignments</a>
          <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
          <a class="nav-link" href="https://github.com/HyeonWooNa0861/HyeonWooNa0861.github.io">GitHub</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="wrap">
        {{ content }}
      </div>
    </main>
  </body>
</html>
